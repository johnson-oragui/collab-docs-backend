name: Backend CI

on:
  pull_request:
    branches: ['main', 'develop']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        env:
          REDIS_URL: redis://localhost:6379
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Copy application environment file
        run: cp .env.sample .env

      - name: Install backend dependencies
        run: npm ci

      - name: Create application and test databases
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const fs = require('node:fs');

          async function createDatabases() {
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: 'postgres',
            });

            await client.connect();

            try {
              const sql = fs.readFileSync(
                'test/fixtures/setup/create-databases.sql',
                'utf8',
              );

              const statements = sql
                .split(';')
                .map(statement => statement.trim())
                .filter(Boolean);

              for (const statement of statements) {
                await client.query(statement);
              }

              console.log('Application and test databases created.');
            } finally {
              await client.end();
            }
          }

          createDatabases().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: username
          DB_PASSWORD: password

      - name: Create test environment file
        run: |
          cat > .env.test <<'EOF'
          PORT=7005
          NODE_ENV=test
          TEST=true

          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=username
          DB_PASSWORD=password
          DB_NAME=test

          JWT_SECRET=ci-test-secret-that-is-long-enough-for-testing
          JWT_ISSUER=collabdocs
          JWT_AUDIENCE=collabdocs-client
          JWT_EXPIRY=10m
          REFRESH_JWT_EXPIRY=30d

          AUTH_COOKIE_NAME=access_token
          AUTH_REFRESH_COOKIE_NAME=refresh_token

          CORS_ORIGIN=http://localhost:3000,http://localhost:3001

          REDIS_URL=redis://localhost:6379/1
          EOF

      - name: Verify test environment
        run: |
          test -f .env.test
          grep -E '^(NODE_ENV|TEST|DB_HOST|DB_PORT|DB_NAME)=' .env.test

      - name: Run application database migrations
        run: npm run migration:run
        env:
          NODE_ENV: development
          TEST: 'false'
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: username
          DB_PASSWORD: password
          DB_NAME: database

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npm run test:e2e
